name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build 26.x
        run: |
          cd 26.x
          ../gradlew build --no-daemon

      - name: Build 1.21-modern
        run: |
          cd 1.21-modern
          ../gradlew remapJar --no-daemon

      - name: Prepare versioned JARs
        run: |
          mkdir -p release-jars
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          
          # 1. Minecraft 26.x Jars
          JAR_26=$(ls 26.x/build/libs/*.jar | grep -v -- "-sources.jar" | head -n 1)
          cp "$JAR_26" "release-jars/jnlyrics-${VERSION}+26.1.jar"
          cp "$JAR_26" "release-jars/jnlyrics-${VERSION}+26.2.jar"
          cp "$JAR_26" "release-jars/jnlyrics-${VERSION}+26.3.jar"
          
          # 2. Minecraft 1.21.2 - 1.21.11 Jars
          JAR_121=$(ls 1.21-modern/build/libs/*.jar | grep -v -- "-sources.jar" | head -n 1)
          for sub in 1.21.2 1.21.3 1.21.4 1.21.5 1.21.6 1.21.7 1.21.8 1.21.9 1.21.10 1.21.11; do
            cp "$JAR_121" "release-jars/jnlyrics-${VERSION}+${sub}.jar"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-jars/*
          generate_release_notes: true
          name: JNLyrics ${{ github.ref_name }} (MC 26.x & 1.21.x)
          draft: false
          prerelease: false
