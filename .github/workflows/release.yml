name: Release

on:
  push:
    tags:
      - "v*+1.21*"
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release (1.21.4)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build 1.21.4
        run: ./gradlew build --no-daemon

      - name: Prepare versioned JARs
        run: |
          mkdir -p release-jars
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          
          JAR_121=$(ls build/libs/*.jar | grep -v -- "-sources.jar" | head -n 1)
          cp "$JAR_121" "release-jars/jnlyrics-${VERSION}+1.21.4.jar"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-jars/*
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Publish to Modrinth
        if: ${{ secrets.MODRINTH_TOKEN != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-id: "jnlyrics"
          version: "${{ github.ref_name }}+1.21.4"
          name: "JNLyrics ${{ github.ref_name }} (Fabric 1.21.4)"
          version-type: "release"
          changelog: "Official release of JNLyrics for Fabric. See full changelog at https://github.com/zeinzrtra/JNLyrics/releases"
          files: "release-jars/*.jar"
          loaders: |
            fabric
          game-versions: |
            1.21.2
            1.21.3
            1.21.4
            1.21.5
            1.21.6
            1.21.7
            1.21.8
            1.21.9
            1.21.10
            1.21.11
          fail-mode: warn
