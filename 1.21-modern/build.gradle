plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT'
    id 'maven-publish'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net"
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("../LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}

remapJar {
    doLast {
        def outJar = archiveFile.get().asFile
        if (outJar.length() < 10000) {
            def devJar = tasks.jar.archiveFile.get().asFile
            def mappingFile = file("${System.getProperty('user.home')}/.gradle/caches/fabric-loom/${project.minecraft_version}/net.fabricmc.yarn.${project.minecraft_version.replace('.', '_')}.${project.yarn_mappings}-v2/mappings.tiny")
            def mcJar = file("${System.getProperty('user.home')}/.gradle/caches/fabric-loom/${project.minecraft_version}/minecraft-merged.jar")
            
            def trJar = file("${System.getProperty('user.home')}/.gradle/caches/modules-2/files-2.1/net.fabricmc/tiny-remapper/0.10.4/1a36cbf58694950061b5bdf4c45de46b2014baf5/tiny-remapper-0.10.4.jar")
            def asmJars = fileTree("${System.getProperty('user.home')}/.gradle/caches/modules-2/files-2.1/org.ow2.asm") { include '**/*.jar' }.files.collect { it.absolutePath }.join(';')
            def mapJars = fileTree("${System.getProperty('user.home')}/.gradle/caches/modules-2/files-2.1/net.fabricmc/mapping-io") { include '**/*.jar' }.files.collect { it.absolutePath }.join(';')
            
            def cp = "${trJar.absolutePath};${asmJars};${mapJars}"
            
            println "[JNLyrics] Post-remapping ${devJar.name} -> ${outJar.name} using TinyRemapper..."
            if (outJar.exists()) outJar.delete()
            def proc = new ProcessBuilder("java", "-cp", cp, "net.fabricmc.tinyremapper.Main",
                    devJar.absolutePath, outJar.absolutePath, mappingFile.absolutePath,
                    "named", "intermediary", mcJar.absolutePath).redirectErrorStream(true).start()
            def reader = new BufferedReader(new InputStreamReader(proc.inputStream))
            String line
            while ((line = reader.readLine()) != null) {
                println "  [TinyRemapper] " + line
            }
            int code = proc.waitFor()
            if (code != 0) {
                throw new GradleException("TinyRemapper failed with exit code: " + code)
            }
        }
    }
}
