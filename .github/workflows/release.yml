name: Release

on:
  push:
    tags:
      - "v*+26*"
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release (26.x)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build 26.x
        run: ./gradlew build --no-daemon

      - name: Prepare versioned JARs
        run: |
          mkdir -p release-jars
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          
          JAR_26=$(ls build/libs/*.jar | grep -v -- "-sources.jar" | head -n 1)
          cp "$JAR_26" "release-jars/jnlyrics-${VERSION}+26.x.jar"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-jars/*
          generate_release_notes: true
          draft: false
          prerelease: false
