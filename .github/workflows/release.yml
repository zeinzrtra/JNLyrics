name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-26:
    name: Build 26.x (Java 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build 26.x
        run: ./gradlew build --no-daemon

      - name: Prepare 26.x JAR
        run: |
          mkdir -p release-jars
          TAG_NAME="${{ github.event.release.tag_name || github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          JAR_26=$(ls build/libs/*.jar | grep -v -- "-sources.jar" | head -n 1)
          cp "$JAR_26" "release-jars/jnlyrics-${VERSION}+26.x.jar"

      - name: Upload 26.x artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-26
          path: release-jars/*.jar

  build-121:
    name: Build 1.21.4 (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 1.21.4 branch
        uses: actions/checkout@v4
        with:
          ref: 1.21.4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build 1.21.4
        run: ./gradlew build --no-daemon

      - name: Prepare 1.21.4 JAR
        run: |
          mkdir -p release-jars
          TAG_NAME="${{ github.event.release.tag_name || github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          JAR_121=$(ls build/libs/*.jar | grep -v -- "-sources.jar" | head -n 1)
          cp "$JAR_121" "release-jars/jnlyrics-${VERSION}+1.21.4.jar"

      - name: Upload 1.21.4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-121
          path: release-jars/*.jar

  publish:
    name: Publish to GitHub Releases & Modrinth
    needs: [build-26, build-121]
    runs-on: ubuntu-latest
    steps:
      - name: Create release-jars folder
        run: mkdir -p release-jars

      - name: Download 26.x JAR
        uses: actions/download-artifact@v4
        with:
          name: jar-26
          path: release-jars

      - name: Download 1.21.4 JAR
        uses: actions/download-artifact@v4
        with:
          name: jar-121
          path: release-jars

      - name: List collected JARs
        run: ls -la release-jars/

      - name: Upload both JARs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-jars/*
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Publish 26.x to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-id: "jnlyrics"
          version: "${{ github.event.release.tag_name || github.ref_name }}+26.x"
          name: "JNLyrics ${{ github.event.release.tag_name || github.ref_name }} (Fabric 26.x)"
          version-type: "release"
          changelog: "Official release of JNLyrics for Fabric. See full changelog at https://github.com/zeinzrtra/JNLyrics/releases"
          files: "release-jars/*+26.x.jar"
          loaders: |
            fabric
          game-versions: |
            26.1
            26.1.1
            26.1.2
            26.2
            26.3
            26.4

      - name: Publish 1.21.4 to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-id: "jnlyrics"
          version: "${{ github.event.release.tag_name || github.ref_name }}+1.21.4"
          name: "JNLyrics ${{ github.event.release.tag_name || github.ref_name }} (Fabric 1.21.4)"
          version-type: "release"
          changelog: "Official release of JNLyrics for Fabric. See full changelog at https://github.com/zeinzrtra/JNLyrics/releases"
          files: "release-jars/*+1.21.4.jar"
          loaders: |
            fabric
          game-versions: |
            1.21.2
            1.21.3
            1.21.4
            1.21.5
            1.21.6
            1.21.7
            1.21.8
            1.21.9
            1.21.10
            1.21.11
