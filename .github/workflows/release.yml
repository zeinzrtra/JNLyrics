name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish Release (26.x)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build mod
        run: ./gradlew build --no-daemon

      - name: Prepare versioned JARs
        run: |
          mkdir -p release-jars
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          
          # Cari jar utama hasil kompilasi
          PRIMARY_JAR=$(ls build/libs/*.jar | grep -v -- "-sources.jar" | head -n 1)
          
          # Gandakan dengan nama sesuai sub-versi 26.x agar user mendapatkan nama file yang pas
          cp "$PRIMARY_JAR" "release-jars/jnlyrics-${VERSION}+26.1.jar"
          cp "$PRIMARY_JAR" "release-jars/jnlyrics-${VERSION}+26.2.jar"
          cp "$PRIMARY_JAR" "release-jars/jnlyrics-${VERSION}+26.3.jar"
          
          # Sertakan sources jar jika ada
          SOURCES_JAR=$(ls build/libs/*-sources.jar 2>/dev/null | head -n 1)
          if [ -n "$SOURCES_JAR" ]; then
            cp "$SOURCES_JAR" "release-jars/jnlyrics-${VERSION}-sources.jar"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-jars/*
          generate_release_notes: true
          name: JNLyrics ${{ github.ref_name }} (Minecraft 26.x)
          draft: false
          prerelease: false
